[package]
name = "predictions_service"
version = "0.1.0"
edition = "2024"
description = "Scrollr predictions channel ingestion service — streams real-time Kalshi prediction-market data via REST + WebSocket."
authors = ["Brandon Ruth <brandon@myscrollr.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/brandon-relentnet/myscrollr"
homepage = "https://myscrollr.com"
publish = false

[dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
futures-util = "0.3"
anyhow = "1.0"
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = { version = "0.8", features = ["macros", "json"] }
# serve_bridge dev binary: permissive CORS for the Tauri webview, a stable
# volume-ordered feed map, and broadcast->SSE stream adaptation.
tower-http = { version = "0.6", features = ["cors"] }
indexmap = { version = "2", features = ["serde"] }
tokio-stream = { version = "0.1", features = ["sync"] }
dotenv = "0.15"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "migrate"] }
# Sentry — error monitoring. send_default_pii=false by default; explicit scrubbing in before_send (main.rs init_sentry).
sentry = { version = "0.42", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
    "anyhow",
    "release-health",
] }
sentry-anyhow = "0.42"
dirs = "5"
# Kalshi RSA-PSS request signing (PKCS#1/PKCS#8 PEM, PSS+SHA-256, base64).
rsa = { version = "0.9", features = ["pem"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
