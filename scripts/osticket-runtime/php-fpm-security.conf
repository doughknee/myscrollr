[www]
; osTicket enables these in bootstrap.php; pool admin flags cannot be overridden.
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
; Keep diagnostics in private container logs, never in the HTTP response.
php_admin_value[error_log] = /proc/self/fd/2
