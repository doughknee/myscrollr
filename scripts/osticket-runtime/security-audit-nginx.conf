# Only fixed route categories go to the collector; never URI/query/body/header values.
map $request_uri $scrollr_audit_route {
    default other;
    ~^/(index\.php)?(?:\?|$) home;
    ~^/open\.php(?:\?|$) support;
    ~^/login\.php(?:\?|$) login;
    ~^/account\.php(?:\?|$) account;
    ~^/pwreset\.php(?:\?|$) password;
    ~^/(tickets|view)\.php(?:\?|$) ticket;
    ~^/file\.php(?:\?|$) file;
    ~^/ajax\.php/draft(?:/|\?|$) upload;
    ~^/ajax\.php(?:/|\?|$) ajax;
    ~^/scp(?:/|\?|$) staff;
    ~^/api(?:/|\?|$) api;
}
log_format scrollr_audit escape=json
    '{"peer":"$remote_addr","forwarded":"$http_x_forwarded_for",'
    '"method":"$request_method","route":"$scrollr_audit_route","status":$status}';
