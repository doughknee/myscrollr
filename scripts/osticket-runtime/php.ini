; Carried over from the tiredofit/osticket image.
memory_limit = 128M
max_execution_time = 30
max_input_time = 180
post_max_size = 2G
upload_max_filesize = 2G
date.timezone = Etc/GMT
expose_php = Off
; osTicket 1.x trips PHP 8.2 deprecations; printed, they land before the
; headers and break sessions and redirects.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
