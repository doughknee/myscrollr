<!doctype html>
<!--
  Kalshi channel PREVIEW HARNESS — dev-only, browser-only.

  Mounts the real PredictionsFeedTab in a plain browser (no Tauri) against
  live data from the local predictions API, so the channel UI can be
  screenshotted/reviewed at arbitrary viewport widths (1440/375) without
  driving the native window. Served by the normal `npm run dev` Vite server:

      http://localhost:5174/src/channels/predictions/preview/index.html

  Query params: ?theme=scrollr-dark (default scrollr-light)
                ?density=compact    (default comfort)
                ?lens=watchlist     (pre-star a few markets and open a lens)
  Not part of the production build (vite build uses explicit rollup inputs).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalshi channel preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
