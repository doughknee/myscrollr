apiVersion: v1
kind: ConfigMap
metadata:
  name: channels-config
  namespace: scrollr
data:
  # Shared across all channel APIs
  ALLOWED_ORIGINS: "https://myscrollr.com,https://api.myscrollr.com"
  FRONTEND_URL: "https://myscrollr.com"

  # Channel API self-registration URLs (K8s Service DNS)
  # (finance/sports/rss/predictions APIs folded into core-api — ADR-0002;
  # fantasy is the one remaining channel service)
  FANTASY_CHANNEL_URL: "http://fantasy-api:8084"

  # Sports ingester (sports-service). Fallback daily quota per api-sports
  # host until a response carries x-ratelimit-requests-limit; the header
  # then wins in both directions (Ultra for all sports until ~2026-12-06,
  # REL-219). Live games poll every MIN seconds on Ultra, MAX on Pro.
  # Every request is paced to the PER-MINUTE limit api-sports advertises
  # (450/min = one send per 133 ms, one bucket for the whole key), and an
  # in-band rateLimit backs the whole process off (REL-229), so MIN can sit
  # at the Ultra cadence without bursting.
  SPORTS_DAILY_QUOTA: "7500"
  SPORTS_LIVE_POLL_MIN_SECS: "15"
  SPORTS_LIVE_POLL_MAX_SECS: "60"

  # Fantasy-specific
  YAHOO_CALLBACK_URL: "https://api.myscrollr.com/yahoo/callback"
  SYNC_ENABLED: "true"
  SYNC_INTERVAL_SECS: "120"
  SYNC_CONCURRENCY: "40"
