apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictions-service
  namespace: scrollr
  labels:
    app: predictions-service
spec:
  replicas: 1
  progressDeadlineSeconds: 1500
  selector:
    matchLabels:
      app: predictions-service
  template:
    metadata:
      labels:
        app: predictions-service
    spec:
      containers:
        - name: predictions-service
          image: registry.digitalocean.com/scrollr/predictions-service:latest
          ports:
            - containerPort: 3005
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scrollr-secrets
                  key: DATABASE_URL
            # Kalshi API credentials (RSA-PSS signed requests). KALSHI_ENV
            # selects demo|prod endpoints; the private key is inline PEM.
            - name: KALSHI_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: scrollr-secrets
                  key: KALSHI_API_KEY_ID
            - name: KALSHI_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: scrollr-secrets
                  key: KALSHI_PRIVATE_KEY
            - name: KALSHI_ENV
              valueFrom:
                secretKeyRef:
                  name: scrollr-secrets
                  key: KALSHI_ENV
                  optional: true
            - name: PORT
              value: "3005"
            # Sentry — set PREDICTIONS_SERVICE_SENTRY_DSN in scrollr-secrets
            # once a Sentry project exists for this service (the other
            # services inline per-service DSNs; this one has no project yet).
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: scrollr-secrets
                  key: PREDICTIONS_SERVICE_SENTRY_DSN
                  optional: true
            - name: ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: scrollr-secrets
                  key: ENVIRONMENT
                  optional: true
            - name: GIT_SHA
              valueFrom:
                secretKeyRef:
                  name: scrollr-secrets
                  key: GIT_SHA
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Startup: DB init retries + catalog sweep + first WS connect.
          startupProbe:
            httpGet:
              path: /health/ready
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          # Liveness: process-alive only. Kalshi WS reconnects are handled
          # by the backoff loop, not a reason to SIGTERM.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 3
          # Readiness: 503 when the ingestion staleness window is exceeded.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: predictions-service
  namespace: scrollr
spec:
  selector:
    app: predictions-service
  ports:
    - port: 3005
      targetPort: 3005
  type: ClusterIP
