# =============================================================================
# Network policies — enforce the gateway trust model at the network layer
# =============================================================================
#
# The channel APIs trust the `X-User-Sub` header set by the core API proxy
# (see api/CHANNELS.md). That trust is only sound if nothing except the core
# API can reach them. These policies make that guarantee real:
#
#   ingress-nginx ──► website:3000
#   ingress-nginx ──► core-api:8080
#   core-api      ──► {finance,sports,rss}-service  (3001/3002/3004 — the
#                     widget read APIs folded into core, ADR-0002; health
#                     probes + /{source}/health)
#
# Everything else inbound is denied by the namespace-wide default-deny.
# Workload egress excludes link-local metadata; DNS and public feed/database access remain allowed.
#
# Notes:
#   - Kubelet liveness/readiness probes and `kubectl port-forward` (used by
#     scripts/smoke/production-readiness.sh) originate from the node host,
#     which Cilium (DOKS' CNI) allows regardless of policy.
#   - cert-manager's HTTP-01 solver pods run in this namespace and must
#     accept traffic from ingress-nginx, or certificate renewal silently
#     breaks under default-deny. The last policy covers them.
#   - Adding a new ingester? Copy an existing ingester policy and adjust the
#     app label + port. There is no per-source API to pair it with — those
#     were folded into core by ADR-0002.
#   - Rollback: kubectl delete -f k8s/network-policies.yaml
#
# The ingress-nginx namespace is matched via the automatic
# kubernetes.io/metadata.name label (k8s >= 1.21).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: scrollr
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-website
  namespace: scrollr
spec:
  podSelector:
    matchLabels:
      app: website
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-core-api
  namespace: scrollr
spec:
  podSelector:
    matchLabels:
      app: core-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# finance-api was folded into core-api (ADR-0002, REL-14) — core now
# probes finance-service directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-to-finance-service
  namespace: scrollr
spec:
  podSelector:
    matchLabels:
      app: finance-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: core-api
      ports:
        - protocol: TCP
          port: 3001
---
# sports-api was folded into core-api (ADR-0002, REL-15) — core now
# probes sports-service directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-to-sports-service
  namespace: scrollr
spec:
  podSelector:
    matchLabels:
      app: sports-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: core-api
      ports:
        - protocol: TCP
          port: 3002
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-to-rss-service
  namespace: scrollr
spec:
  podSelector:
    matchLabels:
      app: rss-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: core-api
      ports:
        - protocol: TCP
          port: 3004
---
# cert-manager HTTP-01 solver pods are created on demand in this namespace
# during certificate issuance/renewal. Without this, the namespace-wide
# default-deny blocks the ACME challenge and certs stop renewing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-acme-solver
  namespace: scrollr
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# Cilium ipBlock rules exclude cluster pods, so core needs explicit health-probe egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-egress-to-ingesters
  namespace: scrollr
spec:
  podSelector:
    matchLabels:
      app: core-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: finance-service
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - podSelector:
            matchLabels:
              app: sports-service
      ports:
        - protocol: TCP
          port: 3002
    - to:
        - podSelector:
            matchLabels:
              app: rss-service
      ports:
        - protocol: TCP
          port: 3004
---
# Defense in depth for every workload; Cilium needs an explicit cluster DNS allowance.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rss-deny-link-local-egress
  namespace: scrollr
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
        - ipBlock:
            cidr: ::/0
            except:
              - fe80::/10
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
