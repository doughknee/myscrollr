# Announce a published desktop release in Discord with its real notes.
#
# Why a separate workflow, on `release: published`, rather than a last job
# in desktop-release.yml: that workflow runs on push to main and creates a
# DRAFT release with a placeholder body; the hand-written notes only exist
# once the draft is published by hand (v1.5.1: built 21:10, published
# 21:25). A job at the end of the build would announce a draft nobody can
# download yet, with "See the full changelog" as the notes, and
# `github.ref_name` there is `main`, not the tag. Publishing the draft is
# what fires this. Re-read the actual publication before allowing side effects,
# including on the manual dispatch path.
#
# Replaces the repo-level GitHub -> Discord webhook, whose payload for
# release events is a fixed one-liner without the body. Delete that webhook
# (Settings -> Webhooks, the URL ending in /github) or every release posts
# twice: once bare from the bot, once from here. REL-193.
name: Announce Release

on:
  release:
    types: [published]
  # A release published by finish-release.yml (GITHUB_TOKEN) raises no
  # `release` event, so that workflow dispatches this one with the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "The published release to announce (desktop-v…)"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  announce:
    if: startsWith(github.event.release.tag_name, 'desktop-v') || startsWith(inputs.tag, 'desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Resolve actual publication and channel
        id: rel
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          CHANNEL_FEEDS_ENABLED: ${{ vars.DESKTOP_CHANNEL_FEEDS_ENABLED }}
        run: node desktop/scripts/release-event.mjs announce

      - name: Post release to Discord
        if: steps.rel.outputs.eligible == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No webhook configured, skipping"; exit 0; fi
          NAME=$(jq -r .name release-event.json)
          URL=$(jq -r .html_url release-event.json)
          BODY=$(cat body.raw)

          # Discord embeds do not render markdown headings; promote them to
          # bold. Notes typed in the web editor arrive with CRLF, which
          # would defeat the `$` anchor, so strip CRs first.
          printf '%s' "$BODY" | tr -d '\r' | sed -E 's/^#{1,3} (.*)$/**\1**/' > body.txt

          # jq builds the payload -- release notes carry quotes, emoji and
          # newlines that break hand-rolled JSON -- and does the length cap,
          # so a multi-byte character is never split (Discord's limit is
          # 4096 characters; the title still links to the full notes).
          jq -n --arg n "Scrollr $NAME" --rawfile b body.txt --arg u "$URL" '{
            content: "Update at <https://myscrollr.com/download>.",
            embeds: [{
              title: $n,
              url: $u,
              description: ($b | if length > 3900 then .[:3900] + "…" else . end),
              color: 8313509
            }]
          }' > payload.json

          curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
          echo "Announced $NAME"

      # The same publish event tells the support queue to draft "this is
      # fixed in X" for cases whose linked Linear issue is Done (REL-245).
      # It rides here rather than in a second workflow on the same trigger:
      # one event, one place to look when the follow-ups don't appear.
      #
      # core-api does the work because the Linear and osTicket credentials
      # live there, not on a runner — same reasoning as auto-close-osticket.yml,
      # and the same shared secret. Best-effort: a failure here never fails
      # the release announcement.
      - name: Queue shipped-fix follow-ups
        if: steps.rel.outputs.eligible == 'true'
        env:
          API_BASE: ${{ vars.SCROLLR_API_BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.OSTICKET_PR_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::warning::OSTICKET_PR_WEBHOOK_SECRET not set; skipping shipped follow-ups."
            exit 0
          fi
          TAG=$(jq -r .tag_name release-event.json)
          URL=$(jq -r .html_url release-event.json)
          API="${API_BASE:-https://api.myscrollr.com}"
          PAYLOAD=$(jq -n --arg v "$TAG" --arg u "$URL" '{version: $v, release_url: $u}')

          set +e
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Webhook-Secret: $WEBHOOK_SECRET" \
            -d "$PAYLOAD" \
            "$API/webhooks/github/release-published")
          CURL_EXIT=$?
          set -e

          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Follow-up queue call failed (curl=$CURL_EXIT http=$HTTP_CODE). Release announcement unaffected."
            exit 0
          fi
          echo "Queued shipped follow-ups for $TAG"
