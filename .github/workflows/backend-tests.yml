name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "channels/**/*.go"
      - "channels/**/*.rs"
      # The desktop app's native half (REL-62). It is Rust, so its gate
      # lives here with every other cargo job rather than in the npm-only
      # frontend workflow.
      - "desktop/src-tauri/**"
      # Generated wire types (VISION 4.6): a Go test pins these to the Go
      # structs, so a hand-edit here must re-run it — same reason the
      # tier-limits snapshot triggers the frontend suite.
      - "desktop/src/types/api.generated.ts"
      - "myscrollr.com/src/types/api.generated.ts"
      # Run on edits to this workflow itself — the setup-go@v6 bump broke
      # all five Go jobs and nothing noticed until an unrelated PR touched
      # api/**.
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "channels/**/*.go"
      - "channels/**/*.rs"
      # The desktop app's native half (REL-62). It is Rust, so its gate
      # lives here with every other cargo job rather than in the npm-only
      # frontend workflow.
      - "desktop/src-tauri/**"
      # Generated wire types (VISION 4.6): a Go test pins these to the Go
      # structs, so a hand-edit here must re-run it — same reason the
      # tier-limits snapshot triggers the frontend suite.
      - "desktop/src/types/api.generated.ts"
      - "myscrollr.com/src/types/api.generated.ts"
      - ".github/workflows/backend-tests.yml"

jobs:
  # ── Go tests (5 independent jobs, run in parallel) ─────────────
  go-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `dir` is where tests run; `modroot` is the module root holding
          # go.mod/go.sum. The core API's packages live under api/core and
          # api/internal/*, so tests run from the module root.
          - dir: api
            modroot: api
            module: github.com/brandon-relentnet/myscrollr/api
          - dir: channels/fantasy/api
            modroot: channels/fantasy/api
            module: github.com/brandon-relentnet/scrollr-fantasy

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    # Real Postgres for integration tests (currently only the api module
    # has them — the GDPR purge cascade and Stripe webhook idempotency).
    # Tests gate on TEST_DATABASE_URL and skip when it's unset, so
    # `go test ./...` still works locally without a database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrollr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real Redis for the Yahoo OAuth callback tests. The handler
      # consumes its CSRF state with GETDEL, and faking that would mean
      # faking the replay protection those tests exist to check. Gated
      # like Postgres: the tests skip when TEST_REDIS_URL is unset, so
      # `go test ./...` still works locally without it.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      # Read the Go version from each module's go.mod instead of pinning
      # it here. setup-go@v6 defaults GOTOOLCHAIN=local, so a stale pin
      # fails hard ("go.mod requires go >= X") rather than silently
      # auto-downloading the right toolchain like v5 did.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.modroot }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.modroot }}/go.sum

      # -v so SKIPs are visible. Several tests here gate on a service
      # being present (TEST_DATABASE_URL, TEST_REDIS_URL) and skip
      # silently otherwise, and without -v a fully-skipped suite is
      # indistinguishable from a passing one — which is exactly how a
      # missing service goes unnoticed.
      - run: go test -v ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scrollr_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0

  # ── Rust tests (4 independent jobs, run in parallel) ───────────
  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: channels/finance/service
          - dir: channels/sports/service
          - dir: channels/rss/service
          - dir: channels/predictions/service

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    # Postgres for tests/schema_contract.rs. These services write with runtime
    # `sqlx::query`, so a core column rename compiles fine and fails only at
    # runtime — where the error is logged, the poll loop continues, reads
    # return an empty Vec, and /health/ready stays 200. Without a database
    # here the contract test skips and the drift stays invisible.
    #
    # Each matrix entry gets its own container, so the four jobs cannot see
    # each other's schema. The test applies core's migrations itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrollr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - run: cargo test --quiet
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scrollr_test?sslmode=disable

  # ── Desktop native tests ───────────────────────────────────────
  # desktop/src-tauri is the app's native half — the OAuth loopback
  # server, the window/tray commands, and the on-device Kalshi signer.
  # It sat outside every matrix until REL-62, so its four auth-server
  # tests ran nowhere: not here, and not on the Windows dev box either,
  # where the test binary aborts with STATUS_ENTRYPOINT_NOT_FOUND before
  # a single test starts.
  #
  # Its own job rather than a `rust-tests` matrix entry, because it needs
  # the webkit dev headers to link and needs no Postgres — the crate
  # never touches the database.
  #
  # No frontend build step: tauri.conf.json points frontendDist at
  # ../dist, which is gitignored and absent on a fresh checkout, but
  # tauri_build::build() compiles fine without it (verified). Adding
  # `npm ci && npm run build` here would just duplicate the vitest job
  # for no gain.
  desktop-rust-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri

    steps:
      - uses: actions/checkout@v6

      # Same package set desktop-release.yml installs for its Linux build.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Not at the repo root, so point the cache at the crate.
          workspaces: desktop/src-tauri
          cache-on-failure: "true"

      - run: cargo test --quiet
