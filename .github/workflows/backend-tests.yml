name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "channels/**/*.go"
      - "channels/**/*.rs"
      # The desktop app's native half (REL-62). It is Rust, so its gate
      # lives here with every other cargo job rather than in the npm-only
      # frontend workflow.
      - "desktop/src-tauri/**"
      # Generated wire types (VISION 4.6): a Go test pins these to the Go
      # structs, so a hand-edit here must re-run it — same reason the
      # tier-limits snapshot triggers the frontend suite.
      - "desktop/src/types/api.generated.ts"
      - "myscrollr.com/src/types/api.generated.ts"
      # Run on edits to this workflow itself — the setup-go@v6 bump broke
      # all five Go jobs and nothing noticed until an unrelated PR touched
      # api/**.
      - ".github/workflows/backend-tests.yml"
      # The migration guard itself, so editing it re-runs it.
      - "scripts/migrations/**"
      # Sources of the generated support knowledge base (REL-242): the
      # support-kb job regenerates it and fails on a stale committed copy.
      - "desktop/package.json"
      - "desktop/src/components/settings/rows.ts"
      - "desktop/src/components/settings/pages.ts"
      - "docs/CHIP_DESIGN.md"
      - "docs/SETTINGS_AUDIT.md"
      - "docs/VISION.md"
      - "docs/ROADMAP.md"
      - "docs/support/**"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "channels/**/*.go"
      - "channels/**/*.rs"
      # The desktop app's native half (REL-62). It is Rust, so its gate
      # lives here with every other cargo job rather than in the npm-only
      # frontend workflow.
      - "desktop/src-tauri/**"
      # Generated wire types (VISION 4.6): a Go test pins these to the Go
      # structs, so a hand-edit here must re-run it — same reason the
      # tier-limits snapshot triggers the frontend suite.
      - "desktop/src/types/api.generated.ts"
      - "myscrollr.com/src/types/api.generated.ts"
      - ".github/workflows/backend-tests.yml"
      # The migration guard itself, so editing it re-runs it.
      - "scripts/migrations/**"
      # Sources of the generated support knowledge base (REL-242): the
      # support-kb job regenerates it and fails on a stale committed copy.
      - "desktop/package.json"
      - "desktop/src/components/settings/rows.ts"
      - "desktop/src/components/settings/pages.ts"
      - "docs/CHIP_DESIGN.md"
      - "docs/SETTINGS_AUDIT.md"
      - "docs/VISION.md"
      - "docs/ROADMAP.md"
      - "docs/support/**"

jobs:
  # ── Schema safety ──────────────────────────────────────────────
  # Migrations run inside platform.ConnectDB() when core-api starts, so a
  # destructive one is applied the moment the new pod boots — before the
  # post-deploy smoke test runs, and before the rollback in deploy.yml could
  # fire. Rolling an image back does not roll a schema back. This is the part
  # of a bad deploy that automation cannot repair, so it is gated up front.
  migrations-additive:
    name: New migrations are additive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the check diffs against the merge base to look at
          # only the migrations this change introduces. The squashed baseline
          # is full of statements it would otherwise flag.
          fetch-depth: 0
      - name: Check api/migrations for destructive statements
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}" || true
          # Invoked through bash rather than executed directly: scripts/ in
          # this repo is committed non-executable (Windows checkouts do not
          # carry the mode bit), so ./script.sh is exit 126 on a runner.
          bash scripts/migrations/check-additive.sh "origin/${{ github.base_ref || 'main' }}"

  # ── Support knowledge base ─────────────────────────────────────
  # The AI triage prompt reads api/internal/support/kb/kb.generated.md,
  # assembled by api/cmd/kbgen from the docs, the settings copy, the widget
  # catalog and the last eight GitHub releases. It is committed so the
  # binary embeds it; this proves the commit is what the sources produce.
  # A bumped package.json, an edited doc or a newly published release
  # without `make kb` fails here.
  support-kb:
    name: Support knowledge base is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - run: go run ./cmd/kbgen
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Fail if the committed knowledge base is stale
        run: |
          if git diff --quiet -- internal/support/kb/; then exit 0; fi
          git diff -- internal/support/kb/

          # Everything above "## Recent release notes" comes from tracked
          # sources; that last section comes from the published GitHub
          # releases. A diff confined to it means a release was published
          # since the KB was last committed — nothing on this branch caused
          # it (SCROLLR-216).
          strip='/^## Recent release notes$/,$d'
          if diff -q \
            <(git show HEAD:api/internal/support/kb/kb.generated.md | sed "$strip") \
            <(sed "$strip" internal/support/kb/kb.generated.md) >/dev/null; then
            echo "::error::Only the release-notes section changed, so a release was probably just published. Fix: run 'make kb' and commit api/internal/support/kb/kb.generated.md, or wait for the Refresh Support Knowledge Base workflow to push the regenerated copy to main and rebase onto it."
          else
            echo "::error::The committed support knowledge base is out of date. Run 'make kb' and commit api/internal/support/kb/kb.generated.md."
          fi
          exit 1

  # ── Go tests ────────────────────────────────────────────────────
  # api/ is the only Go module now (SCROLLR-239 deleted the last other one).
  go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # Real Postgres for integration tests — the GDPR purge cascade and
    # Stripe webhook idempotency. Tests gate on TEST_DATABASE_URL and skip
    # when it's unset, so `go test ./...` still works locally without a
    # database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrollr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      # Read the Go version from go.mod instead of pinning it here.
      # setup-go@v6 defaults GOTOOLCHAIN=local, so a stale pin fails hard
      # ("go.mod requires go >= X") rather than silently auto-downloading
      # the right toolchain like v5 did.
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      # -v so SKIPs are visible. Several tests here gate on
      # TEST_DATABASE_URL being present and skip silently otherwise, and
      # without -v a fully-skipped suite is indistinguishable from a
      # passing one — which is exactly how a missing service goes
      # unnoticed.
      - run: go test -v ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scrollr_test?sslmode=disable

  # ── Rust tests (3 independent jobs, run in parallel) ───────────
  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: channels/finance/service
          - dir: channels/sports/service
          - dir: channels/rss/service

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    # Postgres for tests/schema_contract.rs. These services write with runtime
    # `sqlx::query`, so a core column rename compiles fine and fails only at
    # runtime — where the error is logged, the poll loop continues, reads
    # return an empty Vec, and /health/ready stays 200. Without a database
    # here the contract test skips and the drift stays invisible.
    #
    # Each matrix entry gets its own container, so the four jobs cannot see
    # each other's schema. The test applies core's migrations itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrollr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - run: cargo test --quiet
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scrollr_test?sslmode=disable

  # ── Desktop native tests ───────────────────────────────────────
  # desktop/src-tauri is the app's native half — the OAuth loopback
  # server, the window/tray commands, and the on-device Kalshi signer.
  # It sat outside every matrix until REL-62, so its four auth-server
  # tests ran nowhere: not here, and not on the Windows dev box either,
  # where the test binary aborts with STATUS_ENTRYPOINT_NOT_FOUND before
  # a single test starts.
  #
  # Its own job rather than a `rust-tests` matrix entry, because it needs
  # the webkit dev headers to link and needs no Postgres — the crate
  # never touches the database.
  #
  # Matrix over Linux and macOS (SCROLLR-211): the presence reporter's
  # macOS and Linux signal modules are cfg-gated per-OS, and without a
  # macOS leg the objc2 code in presence_mac.rs would not compile anywhere
  # until the post-merge release build. Windows stays out: the Windows
  # test binary aborts with STATUS_ENTRYPOINT_NOT_FOUND on this toolchain.
  #
  # No frontend build step: tauri.conf.json points frontendDist at
  # ../dist, which is gitignored and absent on a fresh checkout, but
  # tauri_build::build() compiles fine without it (verified). Adding
  # `npm ci && npm run build` here would just duplicate the vitest job
  # for no gain.
  desktop-rust-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/src-tauri

    steps:
      - uses: actions/checkout@v6

      # Same package set desktop-release.yml installs for its Linux build.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      # GitHub's macOS runners ship a Homebrew rustup-init stub at
      # /opt/homebrew/bin/cargo which shadows the real cargo that
      # dtolnay/rust-toolchain installs. Prepending $CARGO_HOME/bin fixes
      # resolution for the cargo invocations below. Same workaround as
      # desktop-release.yml, where the failure was first seen.
      - name: Prefer $CARGO_HOME/bin on PATH (macOS Homebrew rustup workaround)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: .
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          # Not at the repo root, so point the cache at the crate.
          workspaces: desktop/src-tauri
          cache-on-failure: "true"
          # Do not restore ~/.cargo/bin on macOS: a poisoned cache can
          # replace cargo with rustup-init. Same setting as the release
          # workflow.
          prefix-key: "v1-rust-no-bin"
          cache-bin: "false"

      - run: cargo test --quiet
