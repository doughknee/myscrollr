# Explicit publish boundary; resolve/verify scripts are read-only.
name: Finish Desktop Release
# api/internal/ops identifies this title.
run-name: Finish ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact draft desktop-v<version> to verify and publish"
        required: true
      run_id:
        description: "Optional build run; must match the draft source SHA"
        required: false
        default: ""
permissions:
  actions: write
  contents: write
concurrency:
  group: finish-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      channel: ${{ steps.resolve.outputs.channel }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Bind draft and run before any rerun
        id: resolve
        run: node desktop/scripts/finalize-release.mjs resolve
      - name: Complete the bound build
        env:
          BUILD_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          status=$(gh run view "$BUILD_RUN_ID" --json status --jq .status)
          conclusion=$(gh run view "$BUILD_RUN_ID" --json conclusion --jq .conclusion)
          if [ "$status" = completed ] && [ "$conclusion" != success ]; then
            gh run rerun "$BUILD_RUN_ID" --failed
            sleep 10
          fi
          gh run watch "$BUILD_RUN_ID" --exit-status --interval 30
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same lock as build, acquired AFTER reruns finish to avoid deadlocking.
    concurrency:
      group: desktop-release-artifacts
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ needs.prepare.outputs.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify final bytes against this build's evidence
        run: node desktop/scripts/finalize-release.mjs verify
      - name: Publish verified release
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false ]; then
            echo "Already published; verified existing bytes, continuing failed workflow jobs."
          else
            gh release upload "$TAG" "$RUNNER_TEMP/release-verify-$BUILD_RUN_ID/verification.json" --clobber
            gh release edit "$TAG" --draft=false --latest=false
          fi
      - name: Preserve highest Stable legacy Latest
        if: needs.prepare.outputs.channel == 'stable'
        run: node desktop/scripts/repair-desktop-latest.mjs --apply
      - name: Advance approved update channels
        if: vars.DESKTOP_CHANNEL_FEEDS_ENABLED == 'true'
        run: node desktop/scripts/release-channels.mjs --apply
      - name: Verify public update channel bytes
        if: vars.DESKTOP_CHANNEL_FEEDS_ENABLED == 'true'
        run: node desktop/scripts/verify-release-feeds.mjs --expected-dir channel-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-verification-${{ needs.prepare.outputs.run_id }}
          path: ${{ runner.temp }}/release-verify-*/verification.json
          if-no-files-found: ignore
          retention-days: 30


  announce:
    needs: [prepare, publish]
    if: needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Start stable announcement
        run: gh workflow run discord-release.yml --ref main -f tag="$TAG"
  refresh-kb:
    needs: [prepare, publish]
    if: needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Start stable knowledge-base refresh
        run: gh workflow run support-kb-refresh.yml --ref main -f tag="$TAG"
  refresh-website:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start website refresh
        run: gh workflow run deploy.yml --ref main -f services=website
