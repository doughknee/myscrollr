name: Repo shape

# Fails a PR that adds a top-level folder or a new package.json / go.mod /
# Cargo.toml without naming it in AGENTS.md > Repository Layout.
on:
  pull_request:

jobs:
  repo-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fixture test
        run: bash scripts/ci/check-repo-shape.test.sh
      - name: Smoke test checks
        run: bash scripts/smoke/production-readiness.test.sh
      - name: DB-IP pin check
        run: bash scripts/ci/check-dbip-pin.test.sh
      - name: Doc paths still exist
        run: |
          bash scripts/ci/check-doc-paths.test.sh
          bash scripts/ci/check-doc-paths.sh
      - name: Check repo shape against the base
        run: |
          # Full depth: a shallow fetch of a base that moved after this run was
          # triggered cuts its history and leaves no merge base (SCROLLR-456).
          git fetch --no-tags origin "${{ github.base_ref }}"
          bash scripts/ci/check-repo-shape.sh "origin/${{ github.base_ref }}"
