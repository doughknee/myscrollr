# Full local backend for MyScrollr — Postgres + Redis + Core API + every
# channel (Go API + Rust ingester), all in Docker. One command up/down.
#
# The FRONT-ENDS stay native (see the Makefile): the marketing site
# (`make web`) and the Tauri desktop app (`make desktop`). A native GUI
# window can't run inside a Linux container, and both hot-reload better on
# the host anyway.
#
#   make up        # build + start the whole backend, wait for health
#   make down      # stop everything (data kept)
#   make logs      # tail all services
#
# Each service INHERITS its existing gitignored .env (api/.env,
# channels/<ch>/.env) for secrets/config via `env_file`; the `environment`
# block here only OVERRIDES the networking so containers reach each other by
# service name instead of localhost. `environment` wins over `env_file`.
name: scrollr-local

# Postgres + Redis (with volumes + healthchecks) come from the infra-only
# compose so `make up` and the old `docker compose -f docker-compose.local.yml`
# share the SAME containers and volumes — no data loss switching over.
include:
  - docker-compose.local.yml

# ── Shared networking overrides ──────────────────────────────────────
x-db-url: &db-url "postgres://scrollr:scrollr@postgres:5432/scrollr?sslmode=disable"
x-redis-url: &redis-url "redis://redis:6379"

x-needs-db: &needs-db
  postgres:
    condition: service_healthy

x-needs-db-redis: &needs-db-redis
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ── Core API ───────────────────────────────────────────────────────
  # Published on 18080 (not 8080 — Steam's CEF debugger steals localhost:8080
  # on Windows). The desktop app + browser hit http://localhost:18080.
  core-api:
    build:
      context: ./api
    container_name: scrollr-core
    env_file: [api/.env]
    environment:
      PORT: "8080"
      DATABASE_URL: *db-url
      REDIS_URL: *redis-url
      # Local widget sources inside core (ADR-0002, REL-14/15)
      INTERNAL_FINANCE_URL: "http://finance-service:3001"
      INTERNAL_SPORTS_URL: "http://sports-service:3002"
      INTERNAL_PREDICTIONS_URL: "http://predictions-service:3005"
    ports: ["18080:8080"]
    depends_on: *needs-db-redis
    restart: unless-stopped

  # ── RSS ────────────────────────────────────────────────────────────
  rss-service:
    build:
      context: ./channels/rss/service
    container_name: scrollr-rss-svc
    env_file: [channels/rss/.env]
    environment:
      PORT: "3004"
      DATABASE_URL: *db-url
    ports: ["3004:3004"]
    depends_on: *needs-db
    restart: unless-stopped

  rss-api:
    build:
      context: ./channels/rss/api
    container_name: scrollr-rss-api
    env_file: [channels/rss/.env]
    environment:
      PORT: "8083"
      DATABASE_URL: *db-url
      REDIS_URL: *redis-url
      CHANNEL_URL: "http://rss-api:8083"
      INTERNAL_RSS_URL: "http://rss-service:3004"
    ports: ["8083:8083"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rss-service:
        condition: service_started
    restart: unless-stopped

  # ── Finance ─────────────────────────────────────────────────────────
  # The Go API listens on 8081 inside the container but is PUBLISHED on 8181
  # (a Windows svchost holds host-8081). Core reaches it in-network at :8081.
  finance-service:
    build:
      context: ./channels/finance/service
    container_name: scrollr-finance-svc
    env_file: [channels/finance/.env]
    environment:
      PORT: "3001"
      DATABASE_URL: *db-url
    ports: ["3001:3001"]
    depends_on: *needs-db
    restart: unless-stopped

  # (finance-api folded into core-api — ADR-0002, REL-14)

  # ── Sports ──────────────────────────────────────────────────────────
  sports-service:
    build:
      context: ./channels/sports/service
    container_name: scrollr-sports-svc
    env_file: [channels/sports/.env]
    environment:
      PORT: "3002"
      DATABASE_URL: *db-url
    ports: ["3002:3002"]
    depends_on: *needs-db
    restart: unless-stopped

  # (sports-api folded into core-api — ADR-0002, REL-15)

  # ── Fantasy (Go-native, no Rust ingester) ──────────────────────────
  # YAHOO_CALLBACK_URL in the .env points at http://localhost:8084/fantasy/
  # callback — published on 8084, so the browser OAuth redirect still lands.
  fantasy-api:
    build:
      context: ./channels/fantasy/api
    container_name: scrollr-fantasy-api
    env_file: [channels/fantasy/.env]
    environment:
      PORT: "8084"
      DATABASE_URL: *db-url
      REDIS_URL: *redis-url
      CHANNEL_URL: "http://fantasy-api:8084"
    ports: ["8084:8084"]
    depends_on: *needs-db-redis
    restart: unless-stopped

  # ── Predictions (Kalshi) ────────────────────────────────────────────
  # The Rust service's Kalshi private key is a multiline PEM, which Docker's
  # env_file can't parse — so `make prep` extracts it to a file that's
  # mounted here, and the service reads KALSHI_PRIVATE_KEY_PATH instead of
  # the inline var. The other Kalshi vars come from the generated env file.
  predictions-service:
    build:
      context: ./channels/predictions/service
    container_name: scrollr-predictions-svc
    profiles: ["predictions"]
    env_file: [secrets/predictions.docker.env]
    environment:
      PORT: "3005"
      DATABASE_URL: *db-url
      KALSHI_PRIVATE_KEY_PATH: "/run/secrets/kalshi.pem"
    volumes:
      - ./secrets/kalshi-private-key.pem:/run/secrets/kalshi.pem:ro
    ports: ["3005:3005"]
    depends_on: *needs-db
    restart: unless-stopped

  # (predictions-api folded into core-api — ADR-0002, REL-15)
