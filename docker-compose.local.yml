# Local dev infrastructure for MyScrollr — Postgres + Redis only.
#
# The Core API and channel services run NATIVELY (go run / cargo run) against
# these containers, so you can iterate without rebuilding images. This is the
# stateful infra only; everything else is native.
#
#   Bring up:      docker compose -f docker-compose.local.yml up -d
#   Status/logs:   docker compose -f docker-compose.local.yml ps
#                  docker compose -f docker-compose.local.yml logs -f
#   Stop (keep data):  docker compose -f docker-compose.local.yml down
#   Wipe all data:     docker compose -f docker-compose.local.yml down -v
#
# See LOCAL_SETUP.md for the full runbook.
name: scrollr-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: scrollr-postgres
    environment:
      POSTGRES_USER: scrollr
      POSTGRES_PASSWORD: scrollr
      POSTGRES_DB: scrollr
    ports:
      - "5432:5432"
    volumes:
      - scrollr_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrollr -d scrollr"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: scrollr-redis
    ports:
      - "6379:6379"
    volumes:
      - scrollr_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  scrollr_pg:
  scrollr_redis:
